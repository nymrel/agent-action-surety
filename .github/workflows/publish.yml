name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate Node package
        run: npm run check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Verify tag and package versions agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          python -c "import json, os, pathlib, re;
          npm=json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version'];
          py=re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(encoding='utf-8'), re.MULTILINE).group(1);
          tag=os.environ['GITHUB_REF_NAME'];
          assert npm == py == tag.removeprefix('v'), f'version mismatch: npm={npm}, python={py}, tag={tag}'"

      - name: Build npm tarball
        run: |
          mkdir -p release/npm
          npm pack --pack-destination release/npm

      - name: Build and check Python distributions
        run: |
          python -m pip install --disable-pip-version-check build==1.6.0 twine==7.0.0
          python -m build --outdir release/python
          python -m twine check release/python/*

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: release/python/*
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Publish npm package with OIDC
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release/npm

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish to npm
        run: npm publish release/npm/*.tgz --access public

  publish-pypi:
    name: Publish Python package with OIDC
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-action-surety
    permissions:
      id-token: write

    steps:
      - name: Download verified Python artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
