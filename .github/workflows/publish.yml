name: Trusted Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Maintained-runtime and security gates
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read

  codeql:
    name: CodeQL gate
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  build:
    name: Build and verify one release bundle
    needs: [quality, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install the exact trusted-publishing npm CLI
        # zizmor: ignore[adhoc-packages]
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Verify source, ancestry, and Node distribution
        # The just-built local tarball is an intentional ad hoc package input.
        # zizmor: ignore[adhoc-packages]
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run audit
          npm run audit:prod
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
            npm run release:verify -- --tag "${GITHUB_REF_NAME}"
          else
            npm run release:verify
          fi
          mkdir -p release/npm
          npm pack --ignore-scripts --pack-destination release/npm
          mapfile -t packages < <(find release/npm -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packages[@]}" -eq 1
          consumer="${RUNNER_TEMP}/npm-consumer"
          mkdir -p "${consumer}"
          printf '%s\n' '{"name":"nymrel-surety-consumer","private":true,"type":"module"}' > "${consumer}/package.json"
          npm install --ignore-scripts --no-audit --no-fund --prefix "${consumer}" "${GITHUB_WORKSPACE}/${packages[0]}"
          (cd "${consumer}" && node --input-type=module -e "const api = await import('@nymrel/agent-surety'); if (typeof api.PolicyEngine !== 'function' || typeof api.wrapExecution !== 'function') process.exit(1)")
          node "${consumer}/node_modules/@nymrel/agent-surety/dist/cli.js" --help

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Build, validate, and clean-install Python distributions
        # Exact build tools and the local wheel are intentional package inputs.
        # zizmor: ignore[adhoc-packages]
        run: |
          python -m pip install --disable-pip-version-check build==1.6.0 twine==7.0.0
          python -m build --outdir release/python
          python -m twine check release/python/*
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('release/python').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', '--force-reinstall', '--no-deps', str(wheel)])"
          python -m pip check
          python -m unittest discover -s tests/python -p 'test_*.py'
          agent-surety --help

      - name: Upload the immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  attest-release:
    name: Attest the immutable release candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      attestations: write # Create provenance for the exact npm, wheel, and sdist artifacts.
      contents: read
      id-token: write # Exchange the workflow identity for the attestation signing token.
    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: release

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/**/*

  publish-npm:
    name: Publish npm with trusted publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Exchange the npm environment identity for a short-lived publish token.
    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: release

      - name: Set up trusted-publishing Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the exact trusted-publishing npm CLI
        # zizmor: ignore[adhoc-packages]
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Publish exactly one npm distribution
        shell: bash
        run: |
          mapfile -t packages < <(find release/npm -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packages[@]}" -eq 1
          npm publish "${GITHUB_WORKSPACE}/${packages[0]}" --access public

  publish-pypi:
    name: Publish PyPI with trusted publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/agent-action-surety
    permissions:
      contents: read
      id-token: write # Exchange the PyPI environment identity for a short-lived publish token.
    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: release

      - name: Publish the Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/python
