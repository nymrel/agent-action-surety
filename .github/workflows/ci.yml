name: Agent Action Surety CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-action-surety-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned TypeScript compiler
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Type-check and build
        run: |
          npm run lint
          npm run build
      - name: Verify package artifacts
        run: node -e "for (const file of ['dist/index.js','dist/index.d.ts','dist/cli.js']) { if (!require('node:fs').existsSync(file)) throw new Error('missing '+file) }"
      - name: Run Node test suite
        run: npm test
      - name: Smoke-test CLI wrapper
        run: node bin/agent-surety.js check --cmd "git status"

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: python -m compileall -q python/agent_action_surety
      - name: Run Python unit tests
        run: python -m unittest discover -s tests/python -p "test_*.py"
